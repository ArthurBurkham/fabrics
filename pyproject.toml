[project]
name = "fabrics-logistics"
version = "0.1.0"
description = "MIP-based logistics network design: facility location with CFO-legible NPV output"
readme = "README.md"
authors = [
    { name = "Arthur Burkham", email = "unincarty@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "highspy>=1.15.1",
    "pulp>=3.3.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
fabrics = "fabrics.__main__:main"

[tool.pytest.ini_options]
filterwarnings = ["ignore:Constructing LpVariable"]

[dependency-groups]
dev = [
    "numpy>=2.5.2",
    "pytest>=9.1.1",
]


[project.urls]
Homepage = "https://github.com/ArthurBurkham/fabrics"

[tool.uv.build-backend]
module-name = "fabrics"
